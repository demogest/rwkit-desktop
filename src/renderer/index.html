<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' app: data:; frame-src app:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>rwkit 离线包工具</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="progress"></div>
<header class="titlebar">
  <button class="tb-btn" data-act="toggle-sidebar" title="显示 / 隐藏项目列表（Ctrl+B）"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b6ff0"/><stop offset="1" stop-color="#4b3fc4"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg)"/><path d="M16 6.5l8.5 4.6v9.8L16 25.5l-8.5-4.6v-9.8z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M7.8 11.2L16 15.6l8.2-4.4M16 15.6v9.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
    <b>rwkit</b><span>离线包工具</span>
  </div>
  <div class="tb-crumb" id="crumb"></div>
  <div class="tb-spacer"></div>
  <div class="tb-actions">
    <button class="tb-btn text needs-idle" data-act="open-menu"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>打开 / 新建</button>
    <button class="tb-btn" data-act="help" title="使用说明"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
    <button class="tb-btn" data-act="settings" title="设置"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
  </div>
</header>
<div class="shell">
  <aside id="side"></aside>
  <main id="main"><div class="loading"><span class="spin"></span>正在启动…</div></main>
</div>
<div id="layer"></div>
<div id="toasts"></div>
<div id="dropov"><div class="box"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg><div class="t">松开即可打开</div><div class="s">.rwpack 离线包、项目文件夹，或装着它们的文件夹<br>拖到封面区域的图片会设为封面</div></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
